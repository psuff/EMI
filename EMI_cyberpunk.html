<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI - Cyberpunk Mode</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #000000;
            color: #000000;
            height: 100vh;
            justify-content: flex-start;
            margin: 0;
        }
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 512px;
            margin-bottom: 20px;
        }
        h1 {
            color: #6caef5;
            font-size: 3em;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px #6caef5;
        }
        .button-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .button {
            font-size: 1em;
            padding: 10px 20px;
            background-color: transparent;
            color: #0affef;
            border: 2px solid rgba(86, 240, 227, 0.7);
            border-radius: 5px;
            cursor: pointer;
            transition: box-shadow 0.3s;
            box-shadow: 0 0 10px rgba(86, 240, 227, 0.7);
            text-align: center;
            margin: 0 5px;
        }
        .button:hover {
            box-shadow: 0 0 20px rgba(58, 12, 163, 0.7);
        }
        #canvas {
            border: 2px solid #000000;
            background-color: #000000;
            border-radius: 10px;
            position: relative;
        }
        @media (max-width: 600px) {
            #canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>EMI</h1>
        <div class="button-container">
            <button id="startButton" class="button">START</button>
            <button id="recordButton" class="button" style="display: none;">RECORD</button>
        </div>
    </div>
    <div style="position: relative; width: 512px; height: 512px;">
        <canvas id="canvas" width="512" height="512"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const recordButton = document.getElementById('recordButton');
        let ws;
        let audioContext;
        let isRecording = false;
        let recordingWorklet;

        let dataQueue = [];
        let isPlaying = false;

        // Embedded AudioWorklet code
        const workletCode = `
            class RecorderProcessor extends AudioWorkletProcessor {
                constructor() {
                    super();
                    this.recordings = [];
                    this.isRecording = false;

                    this.port.onmessage = (event) => {
                        if (event.data.command === 'getRecording') {
                            const audioData = this.getRecording();
                            this.port.postMessage({ type: 'recording', buffer: audioData });
                        }
                    };
                }

                process(inputs) {
                    if (!this.isRecording) {
                        this.isRecording = true;
                        this.recordings = [];
                    }

                    const input = inputs[0];
                    const channelData = input[0];
                    this.recordings.push(new Float32Array(channelData));

                    return true;
                }

                getRecording() {
                    const recordingLength = this.recordings.reduce((acc, curr) => acc + curr.length, 0);
                    const audioData = new Float32Array(recordingLength);
                    let offset = 0;

                    for (const recording of this.recordings) {
                        audioData.set(recording, offset);
                        offset += recording.length;
                    }

                    // Convert to 16-bit PCM
                    const pcmData = new Int16Array(audioData.length);
                    for (let i = 0; i < audioData.length; i++) {
                        const s = Math.max(-1, Math.min(1, audioData[i]));
                        pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }

                    this.recordings = [];
                    this.isRecording = false;
                    return pcmData;
                }
            }

            registerProcessor('recorder-processor', RecorderProcessor);
        `;

        startButton.onclick = async function() {
            if (ws) {
                ws.close();
            }
            ws = new WebSocket(`ws://${window.location.host}/ws`);
            audioContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
            
            // Create a Blob from the worklet code and create a URL for it
            const blob = new Blob([workletCode], { type: 'application/javascript' });
            const workletUrl = URL.createObjectURL(blob);

            // Add the module using the blob URL
            await audioContext.audioWorklet.addModule(workletUrl);
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                dataQueue.push(data);
                if (!isPlaying) {
                    playNextChunk();
                }
            };

            startButton.style.display = 'none';
            recordButton.style.display = 'block';
        };

        recordButton.onclick = function() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        };

        async function startRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const sourceNode = audioContext.createMediaStreamSource(stream);
            recordingWorklet = new AudioWorkletNode(audioContext, 'recorder-processor');

            sourceNode.connect(recordingWorklet);
            recordingWorklet.connect(audioContext.destination);

            isRecording = true;
            recordButton.textContent = "STOP";
        }

        function stopRecording() {
            isRecording = false;
            recordButton.textContent = "RECORD";

            recordingWorklet.port.postMessage({ command: 'getRecording' });
            recordingWorklet.port.onmessage = (event) => {
                if (event.data.type === 'recording') {
                    sendRecording(event.data.buffer);
                }
            };
        }

        function sendRecording(audioBuffer) {
            // Convert Int16Array to Float32Array
            const float32Buffer = new Float32Array(audioBuffer.length);
            for (let i = 0; i < audioBuffer.length; i++) {
                float32Buffer[i] = audioBuffer[i] / 32768.0;  // Convert 16-bit integer to float
            }

            // Send the raw float32 data
            fetch("/upload/", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/octet-stream'
                },
                body: float32Buffer.buffer
            }).then(response => {
                if (response.ok) {
                    console.log("Audio uploaded successfully");
                } else {
                    console.error("Failed to upload audio");
                }
            }).catch(error => {
                console.error("Error uploading audio:", error);
            });
        }

        function playNextChunk() {
            if (dataQueue.length === 0) {
                isPlaying = false;
                return;
            }
            
            isPlaying = true;
            const chunk = dataQueue.shift();
            
            // Play audio
            const audioData = base64ToArrayBuffer(chunk.audio);
            audioContext.decodeAudioData(audioData, function(buffer) {
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.onended = playNextChunk;
                source.start(0);
                
                // Animate points
                animatePoints(chunk.frames, chunk.duration);
            });
        }

        function animatePoints(frames, duration) {
            const frameDuration = 1 / 30;
            let frameIndex = 0;
            
            function animate(timestamp) {
                if (frameIndex < frames.length) {
                    drawPoints(frames[frameIndex]);
                    frameIndex++;
                    setTimeout(() => requestAnimationFrame(animate), frameDuration * 1000);
                }
            }
            
            requestAnimationFrame(animate);
        }

        // Update the WebSocket onmessage handler
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            dataQueue.push(data);
            if (!isPlaying) {
                playNextChunk();
            }
        };

        function drawPoints(points) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0affef';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#0affef';

            for (let i = 0; i < points.length; i++) {
                const x = points[i][0];
                const y = points[i][1];
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }
    </script>
</body>
</html>
